# Initial YOLOv8 detection scaffold with a timm MobileNetV4-Conv-Medium backbone.
# The backbone uses projected intermediate feature maps so the neck/head wiring
# remains stable even if the native MobileNetV4 stage widths differ.

nc: 80
depth_multiple: 0.67
width_multiple: 0.5
max_channels: 512

backbone:
  - [-1, 1, TorchVision, [160, mobilenetv4_conv_medium.e500_r224_in1k, DEFAULT, true, 0, true, [1, 2, 3], [64, 128, 160]]]

head:
  - [0, 1, Index, [64, 1]]
  - [0, 1, Index, [128, 2]]
  - [0, 1, Index, [160, 3]]

  - [3, 1, SPPF, [160, 5]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C2f, [96]]

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, Conv, [160, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C2f, [256]]

  - [[9, 12, 15], 1, Detect, [nc]]
