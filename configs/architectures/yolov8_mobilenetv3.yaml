# Initial YOLOv8 detection scaffold with a TorchVision MobileNetV3-Large backbone.
# The backbone wiring follows the official Ultralytics TorchVision-style approach.
# Feature map indices should be validated with a dry-run build in the target environment.

nc: 80
depth_multiple: 1.0
width_multiple: 1.0
max_channels: 1024

backbone:
  - [-1, 1, TorchVision, [960, mobilenet_v3_large, DEFAULT, true, 2, true]]

head:
  - [0, 1, Index, [40, 6]]
  - [0, 1, Index, [112, 12]]
  - [0, 1, Index, [160, 16]]

  - [3, 1, SPPF, [160, 5]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [[9, 12, 15], 1, Detect, [nc]]
