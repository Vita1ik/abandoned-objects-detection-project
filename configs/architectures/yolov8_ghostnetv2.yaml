# Initial YOLOv8 detection scaffold with a timm GhostNetV2 backbone.
# The selected feature maps follow the native GhostNetV2 pyramid reductions
# and are projected into YOLO-friendly channel widths for the neck/head.

nc: 80
depth_multiple: 0.67
width_multiple: 0.5
max_channels: 512

backbone:
  - [-1, 1, TorchVision, [160, ghostnetv2_100, NONE, true, 0, true, [1, 2, 3, 4], [24, 40, 80, 160]]]

head:
  - [0, 1, Index, [40, 2]]
  - [0, 1, Index, [80, 3]]
  - [0, 1, Index, [160, 4]]

  - [3, 1, SPPF, [160, 5]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C2f, [96]]

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, Conv, [160, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 2, C2f, [256]]

  - [[9, 12, 15], 1, Detect, [nc]]
