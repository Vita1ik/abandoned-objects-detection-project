# Lighter YOLOv8 detection scaffold with a TorchVision MobileNetV3-Large backbone.
# This variant reduces the neck/head width and depth to improve edge-device inference speed.

nc: 4
depth_multiple: 0.67
width_multiple: 0.5
max_channels: 512

backbone:
  - [-1, 1, TorchVision, [960, mobilenet_v3_large, DEFAULT, true, 2, true]]

head:
  - [0, 1, Index, [40, 6]]
  - [0, 1, Index, [112, 12]]
  - [0, 1, Index, [160, 16]]

  - [3, 1, SPPF, [160, 5]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C2f, [96]]

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C2f, [160]]

  - [-1, 1, Conv, [160, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2f, [256]]

  - [[10, 13, 16], 1, Detect, [nc]]
