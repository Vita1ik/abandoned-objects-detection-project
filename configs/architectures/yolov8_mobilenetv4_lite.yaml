# Lightweight YOLOv8 detection scaffold with a timm MobileNetV4-Conv-Small backbone.
# This variant mirrors the MobileNetV3 lite philosophy: smaller backbone features,
# reduced neck/head width, and lower overall compute for edge-oriented experiments.

nc: 4
depth_multiple: 0.67
width_multiple: 0.5
max_channels: 256

backbone:
  - [-1, 1, TorchVision, [96, mobilenetv4_conv_small, DEFAULT, true, 0, true, [1, 2, 3], [32, 64, 96]]]

head:
  - [0, 1, Index, [32, 1]] # (1) P2 / stride 4
  - [0, 1, Index, [64, 2]] # (2) P3 / stride 8
  - [0, 1, Index, [96, 3]] # (3) P4 / stride 16

  - [3, 1, SPPF, [96, 5]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C2f, [96]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]] 
  - [[-1, 1], 1, Concat, [1]] 
  - [-1, 2, C2f, [64]] 

  # Bottom-up PAN path
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C2f, [96]]

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C2f, [128]]

  - [[10, 13, 16], 1, Detect, [nc]]
