name: yolov8_mobilenetv4_lite
family: yolov8
variant: mobilenetv4
backbone: mobilenetv4
architecture_path: configs/architectures/yolov8_mobilenetv4_lite.yaml
weights_path: artifacts/weights/yolov8_mobilenetv4_lite.pt
pretrained_backbone: true
bootstrap_weights: null
default_imgsz: 512
default_batch: 4
train_overrides:
  optimizer: AdamW
  lr0: 0.0003
  lrf: 0.12
  weight_decay: 0.001
  momentum: 0.9
  warmup_epochs: 3.0
  box: 7.3
  cls: 0.35
  dfl: 1.2
  hsv_h: 0.008
  hsv_s: 0.18
  hsv_v: 0.3
  degrees: 2.0
  translate: 0.05
  scale: 0.3
  fliplr: 0.04
  mosaic: 0.2
  mixup: 0.0
  copy_paste: 0.0
notes: Lightweight YOLOv8 + timm MobileNetV4-Conv-Small variant with a reduced neck/head for faster edge inference. The default training overrides were reduced from the more aggressive Optuna-tuned values to a safer starting point after NaN loss instability during training.
