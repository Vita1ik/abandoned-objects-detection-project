video_source: "data/raw/test_videos/backpack.mp4"
window_title: "Abandoned Object System - MSc Thesis Project"

detector:
  family: yolov8
  variant: baseline
  # variant: mobilenetv3
  # weights_path: runs/detect/runs/train/yolov8_mobilenetv3_lite2/weights/best.pt
  weights_path: yolov8m.pt
  confidence: 0.25
  iou: 0.45
  image_size: 512
  tracker: bytetrack.yaml
  persist_tracking: true
  device: cpu
  target_classes:
    - person
    - backpack
    - handbag
    - suitcase

logic:
  abandon_threshold: 5
  dist_threshold: 160
  fix_confirm_threshold: 0.7

preprocessing:
  enabled: false
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  brightness_beta: 8
  contrast_alpha: 1.08
  gamma: 0.95

runtime:
  detect_every_n_frames: 1
  show_performance_stats: true
  performance_window_size: 30
